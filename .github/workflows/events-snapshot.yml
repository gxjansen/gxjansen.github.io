name: Events snapshot

# Refreshes src/data/events.snapshot.json from Guido's atproto records (Sifa
# talks and projects, and the calendar events they reference) and opens a
# data-only PR that auto-merges once the required checks pass. Merging to
# master deploys the site, so /events picks up new records within a day.
#
# The PR is pushed and opened with EVENTS_SNAPSHOT_TOKEN, a fine-grained
# personal access token (this repo only; Contents and Pull requests: read and
# write). A PR opened with GITHUB_TOKEN does not start the pull_request
# checks, so it could never satisfy branch protection and auto-merge.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: events-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Require the snapshot token
        env:
          TOKEN: ${{ secrets.EVENTS_SNAPSHOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret EVENTS_SNAPSHOT_TOKEN is not set."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.EVENTS_SNAPSHOT_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh snapshot (fails closed on unresolvable refs or shrinkage)
        run: node scripts/snapshot-events.mjs
      - name: Open PR when the records changed
        env:
          GH_TOKEN: ${{ secrets.EVENTS_SNAPSHOT_TOKEN }}
        run: |
          if git diff --quiet -- src/data/events.snapshot.json; then
            echo "No record changes."
            exit 0
          fi
          # One open snapshot PR at a time: a newer refresh supersedes it.
          for n in $(gh pr list --state open --search "head:chore/events-snapshot-" --json number --jq '.[].number'); do
            gh pr close "$n" --delete-branch --comment "Superseded by a newer snapshot refresh."
          done
          branch="chore/events-snapshot-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/data/events.snapshot.json
          git commit -m "chore(events): refresh snapshot from atproto records"
          git push -u origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(events): refresh snapshot from atproto records" \
            --body-file .github/events-snapshot-pr-body.md
          gh pr merge "$branch" --auto --squash --delete-branch
