version: 2
updates:
  # Enable security updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Automatically create PRs for security updates
    open-pull-requests-limit: 10
    # Group minor and patch updates
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Keep major updates separate for review
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # satori stays on 0.26: 0.62+ changes how the OG cards in src/lib/og/
      # lay out. In 0.x every minor can break, so only take patch releases
      # until the cards have been checked against a newer version.
      - dependency-name: "satori"
        update-types: ["version-update:semver-minor"]
    # Auto-label PRs
    labels:
      - "dependencies"
      - "security"

  # Keep workflow actions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
